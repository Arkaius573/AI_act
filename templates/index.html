<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Act Compliance Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-row {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        #status {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .status-dot.ok { background: #22c55e; }
        .status-dot.error { background: #ef4444; }
        .status-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #loading {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #result {
            display: none;
        }

        .risk-badge {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .risk-inaccettabile { background: #fecaca; color: #991b1b; }
        .risk-alto { background: #fed7aa; color: #9a3412; }
        .risk-limitato { background: #fef08a; color: #854d0e; }
        .risk-minimo { background: #bbf7d0; color: #166534; }

        .section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid #e0e0e0;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .articles-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .article-tag {
            background: #e0e7ff;
            color: #3730a3;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .analysis-content {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .analysis-content h2 {
            color: #667eea;
            font-size: 1.2rem;
            margin: 20px 0 10px;
        }

        .analysis-content h2:first-child {
            margin-top: 0;
        }

        .disclaimer {
            background: #fff7ed;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #9a3412;
        }

        .keywords-matched {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        .keyword-tag {
            display: inline-block;
            background: #fef3c7;
            color: #92400e;
            padding: 2px 8px;
            border-radius: 4px;
            margin: 2px;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            .btn-row { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">AI ACT 2024 - REG. UE 2024/1689</div>
            <h1>AI Compliance Checker</h1>
            <p>Verifica conformità al Regolamento Europeo sull'Intelligenza Artificiale</p>
        </header>

        <div class="card">
            <div id="status">
                <div class="status-item">
                    <div class="status-dot loading" id="index-status"></div>
                    <span>Indice AI Act</span>
                </div>
                <div class="status-item">
                    <div class="status-dot loading" id="ollama-status"></div>
                    <span>LLM (Ollama)</span>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Descrizione del Sistema AI</label>
                <textarea id="description" placeholder="Descrivi il tuo sistema AI, il suo scopo, i dati che utilizza, e come viene impiegato...

Esempio: Sistema di intelligenza artificiale per la valutazione automatica dei curriculum vitae dei candidati, che analizza competenze, esperienze pregresse e genera un punteggio di idoneità per posizioni lavorative aperte."></textarea>
            </div>

            <div class="btn-row">
                <button class="btn-primary" id="analyzeBtn" onclick="analyze()">
                    Analizza Conformita
                </button>
                <button class="btn-secondary" onclick="clearForm()">
                    Pulisci
                </button>
            </div>
        </div>

        <div id="loading" class="card">
            <div class="spinner"></div>
            <p>Analisi in corso...</p>
            <p style="color: #666; font-size: 0.9rem; margin-top: 10px;">
                Ricerca articoli rilevanti e generazione report
            </p>
        </div>

        <div id="result" class="card">
            <div class="section">
                <h3>Classificazione Rischio</h3>
                <div id="risk-badge"></div>
                <p id="risk-reason"></p>
                <div id="keywords-matched" class="keywords-matched"></div>
            </div>

            <div class="section">
                <h3>Articoli Rilevanti</h3>
                <div id="articles-list" class="articles-list"></div>
            </div>

            <div class="section">
                <h3>Analisi Dettagliata</h3>
                <div id="analysis-content" class="analysis-content"></div>
            </div>

            <div class="disclaimer" id="disclaimer"></div>
        </div>
    </div>

    <script>
        // Controlla stato sistema all'avvio
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                document.getElementById('index-status').className =
                    'status-dot ' + (data.index_loaded ? 'ok' : 'error');

                document.getElementById('ollama-status').className =
                    'status-dot ' + (data.ollama_available ? 'ok' : 'error');
            } catch (e) {
                document.getElementById('index-status').className = 'status-dot error';
                document.getElementById('ollama-status').className = 'status-dot error';
            }
        }

        // Analisi principale
        async function analyze() {
            const description = document.getElementById('description').value.trim();

            if (description.length < 20) {
                alert('Inserisci una descrizione piu dettagliata (minimo 20 caratteri)');
                return;
            }

            // UI: mostra loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const res = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description })
                });

                const data = await res.json();

                if (data.error) {
                    alert('Errore: ' + data.error);
                    return;
                }

                // Mostra risultati
                displayResults(data);

            } catch (e) {
                alert('Errore di connessione: ' + e.message);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function displayResults(data) {
            // Risk badge
            const riskLevel = data.risk_classification.level;
            const riskBadge = document.getElementById('risk-badge');
            riskBadge.className = 'risk-badge risk-' + riskLevel;
            riskBadge.textContent = 'Rischio: ' + riskLevel.toUpperCase();

            document.getElementById('risk-reason').textContent = data.risk_classification.reason;

            // Keywords matched
            const keywordsDiv = document.getElementById('keywords-matched');
            const allKeywords = [
                ...data.risk_classification.keyword_matches.inaccettabile,
                ...data.risk_classification.keyword_matches.alto_rischio,
                ...data.risk_classification.keyword_matches.trasparenza
            ];

            if (allKeywords.length > 0) {
                keywordsDiv.innerHTML = 'Keywords rilevate: ' +
                    allKeywords.map(k => '<span class="keyword-tag">' + k + '</span>').join(' ');
            } else {
                keywordsDiv.innerHTML = '';
            }

            // Articoli rilevanti
            const articlesList = document.getElementById('articles-list');
            articlesList.innerHTML = data.relevant_articles.map(art =>
                '<span class="article-tag">' + art.title + ' (score: ' + art.relevance + ')</span>'
            ).join('');

            // Analisi dettagliata (formatta markdown basico)
            let analysis = data.detailed_analysis;
            // Converti ## headers
            analysis = analysis.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            // Converti **bold**
            analysis = analysis.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            // Converti liste
            analysis = analysis.replace(/^- (.+)$/gm, '&bull; $1');

            document.getElementById('analysis-content').innerHTML = analysis;

            // Disclaimer
            document.getElementById('disclaimer').textContent = data.disclaimer;

            // Mostra risultati
            document.getElementById('result').style.display = 'block';

            // Scroll ai risultati
            document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
        }

        function clearForm() {
            document.getElementById('description').value = '';
            document.getElementById('result').style.display = 'none';
        }

        // Check status on load
        checkStatus();
    </script>
</body>
</html>
